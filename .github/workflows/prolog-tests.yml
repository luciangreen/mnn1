name: Prolog tests

on:
  push:
  pull_request:

jobs:
  plunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
      - name: Run plunit tests
        run: swipl -q -s tests/run.pl
